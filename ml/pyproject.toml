[project]
name = "nexus-ml"
version = "0.1.0"
description = "Entrenamiento por refuerzo de los bots de NexusPlay (solo desarrollo: no se despliega)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "gymnasium>=1.0",
  "torch>=2.5",
  "stable-baselines3>=2.4",
  "sb3-contrib>=2.4",
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
