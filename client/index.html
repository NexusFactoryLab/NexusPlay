<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusPlay · Aprende jugando. Compite en serio.</title>
    <meta name="description" content="Convierte cualquier tema en un juego, rétate con tu clase y sube en el ranking de tu universidad." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexusplay-theme')
          var theme =
            stored === 'fantasy' || stored === 'meadow' || stored === 'light' || stored === 'dark' || stored === 'kids'
              ? stored
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
